<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hexa | Video Editing Pro & CapCut Mentor — Vercel Analytics</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Vercel Analytics (official) - tracks visitors & page views automatically -->
    <script defer src="https://vercel.live/_next-live/feedback/analytics.js"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        
        // Track page view and custom events
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof va === 'function') {
                va('event', 'page_view', { page: window.location.pathname });
            }
        });

        // Custom analytics tracking for interactions
        function trackAnalytics(eventName, label) {
            if (typeof va !== 'undefined') {
                va('event', eventName, { label });
                console.log(`📊 Vercel Analytics: ${eventName} - ${label}`);
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --secondary: #8b5cf6;
            --accent: #f43f5e;
            --bg-dark: #0a0f1c;
            --bg-darker: #02040c;
            --bg-card: #111827;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #6b7280;
            --border: #1f2937;
            --glow: rgba(6, 182, 212, 0.5);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.1) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* custom scroll */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-darker); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* Glass Navigation */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 15, 28, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(6, 182, 212, 0.4);
            z-index: 1000;
            padding: 0.9rem 2rem;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            -webkit-text-fill-color: white;
            box-shadow: 0 0 12px var(--glow);
        }

        .nav-links {
            display: flex;
            gap: 2.2rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            text-shadow: 0 0 6px rgba(6,182,212,0.6);
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.6rem;
            cursor: pointer;
        }

        /* Hero Section with Typing Effect */
        .hero {
            margin-top: 80px;
            padding: 5rem 2rem;
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            min-height: calc(100vh - 80px);
        }
        .hero-content h1 {
            font-size: 3.8rem;
            line-height: 1.2;
            font-weight: 900;
            letter-spacing: -0.02em;
        }
        .gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .typing-container {
            font-size: 1.35rem;
            color: var(--text-secondary);
            margin: 1.5rem 0;
            min-height: 5rem;
        }
        #typing-text {
            border-right: 2px solid var(--primary);
            padding-right: 5px;
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink { 0%, 100% { border-color: transparent; } 50% { border-color: var(--primary); } }
        
        .hero-buttons { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
        .btn {
            padding: 0.9rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(95deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 5px 20px rgba(6,182,212,0.4);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(6,182,212,0.6); }
        .btn-secondary {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-primary);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: rgba(6,182,212,0.1); }

        .hero-visual {
            background: radial-gradient(ellipse, rgba(6,182,212,0.15), rgba(139,92,246,0.08));
            border: 1px solid rgba(6,182,212,0.4);
            border-radius: 32px;
            height: 400px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 32px;
            transition: transform 0.5s;
        }
        .hero-visual:hover .hero-image { transform: scale(1.02); }

        /* Sections */
        section {
            padding: 5rem 2rem;
            max-width: 1280px;
            margin: 0 auto;
        }
        section h2 {
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .section-alt { background: rgba(17, 24, 39, 0.5); backdrop-filter: blur(4px); border-radius: 48px; margin: 1rem auto; }

        /* About & Skills */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .skill-item {
            background: rgba(30,41,59,0.7);
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            transition: 0.2s;
        }
        .skill-item:hover { border-color: var(--primary); background: rgba(6,182,212,0.15); }
        .experience-card {
            background: linear-gradient(145deg, rgba(6,182,212,0.1), rgba(139,92,246,0.1));
            border: 1px solid rgba(6,182,212,0.4);
            padding: 2rem;
            border-radius: 28px;
        }
        /* Portfolio Grid with design.png */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .portfolio-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.35s;
            cursor: pointer;
        }
        .portfolio-card:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 20px 35px rgba(6,182,212,0.25);
        }
        .portfolio-image {
            height: 200px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .portfolio-img-tag {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .portfolio-content { padding: 1.5rem; }
        .portfolio-category { color: var(--primary); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .portfolio-title { font-size: 1.3rem; font-weight: 700; margin: 0.5rem 0; }

        /* Course & Pricing */
        .course-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2.5rem;
        }
        .course-card, .pricing-card {
            background: rgba(30,41,59,0.7);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 28px;
        }
        .pricing-card {
            background: linear-gradient(145deg, rgba(6,182,212,0.15), rgba(139,92,246,0.1));
            border-color: rgba(6,182,212,0.5);
            position: sticky;
            top: 100px;
        }
        .price { font-size: 3rem; font-weight: 800; color: var(--primary); }
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
            gap: 2rem;
        }
        .testimonial-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 24px;
        }
        .stars { color: #fbbf24; margin-bottom: 1rem; }
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.9rem;
            background: rgba(30,41,59,0.8);
            border: 1px solid var(--border);
            border-radius: 18px;
            color: white;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
        }
        .footer {
            background: var(--bg-darker);
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
        }
        .analytics-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #94a3b8;
            border: 1px solid var(--primary);
            z-index: 99;
            font-family: monospace;
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .menu-toggle { display: block; }
            .hero { grid-template-columns: 1fr; margin-top: 70px; }
            .hero-content h1 { font-size: 2.5rem; }
            .about-grid, .course-container, .contact-container { grid-template-columns: 1fr; }
            .pricing-card { position: static; }
            section { padding: 3rem 1rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo"><div class="logo-icon">🎬</div><span>Hexa Edits</span></div>
        <ul class="nav-links">
            <li><a href="#home" class="nav-link active">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
